# TEST ONLY. LibreChat v0.8.9 config of the test stack: the snippets of
# docs/setup/example-keycloak-librechat.md, plus one AI model (not part of the manual).
version: 1.3.19

# --- Your LLM endpoint (not part of the manual). The test stack uses the shared LiteLLM endpoint: key,
# base URL and model all come from the key file (LITELLM_KEY, LITELLM_BASE_URL, LITELLM_MODEL; on the
# test VM /root/shared/llm.env, else test-stack/llm.env). For another provider, change this block, the
# variable names in llm.env and the preset below. Use a model that supports tool calls.
endpoints:
  custom:
    - name: LiteLLM
      apiKey: "${LITELLM_KEY}"
      baseURL: "${LITELLM_BASE_URL}"
      models:
        default: ["${LITELLM_MODEL}"]
        fetch: false
      titleConvo: false

# --- From the example manual, section "librechat.yaml: the iTop MCP server"
mcpServers:
  itop:
    type: streamable-http
    # Exactly the MCP server's MCP_RESOURCE_URL.
    url: https://mcp.example.com/mcp
    title: iTop
    description: Tickets, CIs and contacts from iTop, with your own iTop rights
    # Every user connects with their own iTop account.
    requiresOAuth: true

mcpSettings:
  allowedDomains:
    - "https://mcp.example.com"
    - "https://itop.example.com"

# With the option "iTop assistant preselected" (prioritize, enforce, default).
modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: itop-assistant
      default: true
      label: iTop assistant
      description: Answers questions about iTop with your own iTop rights
      preset:
        # Your endpoint and model (see above).
        endpoint: LiteLLM
        model: "${LITELLM_MODEL}"
      mcpServers:
        - itop
