# TEST ONLY. nginx as TLS proxy for the hostnames other than mcp.example.com (compose.nginx.yaml).
# mcp.example.com comes from the README at start-up (start.sh). Like the Caddyfile, this passes the
# Host header and X-Forwarded-Proto/-For/-Host, as the manuals require.

# Docker's DNS. With the upstream in a variable, nginx resolves it per request, so the proxy can
# start before iTop, Keycloak and LibreChat (LibreChat itself waits for the setup behind the proxy).
resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate     /certs/site.crt;
ssl_certificate_key /certs/site.key;

# Keycloak and iTop send large cookies and headers on login.
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

server {
    listen 443 ssl;
    http2 on;
    server_name itop.example.com;
    location / {
        set $up itop:80;
        proxy_pass http://$up;
        include /etc/nginx/stack/proxy-headers.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sso.example.com;
    location / {
        set $up keycloak:8080;
        proxy_pass http://$up;
        include /etc/nginx/stack/proxy-headers.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;
    location / {
        set $up librechat:3080;
        proxy_pass http://$up;
        include /etc/nginx/stack/proxy-headers.conf;
        # Chat answers stream as server-sent events.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
